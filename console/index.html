<!doctype html>
<html lang="en">
<head><script>window.SWL_DEMO={page:"console"}</script><script src="../demo-sheet.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>scalewithluv console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* scalewithluv brand: yellow #FFC700 + near-black on soft grey; floating glass bars, black pills, a serif-italic accent
   word on a yellow highlight (as in the carousels). Light only. */
:root{--bg:#f1f1f3;--surface:#fff;--surface-2:#f4f4f6;--hair:rgba(17,17,20,.07);--hair-2:rgba(17,17,20,.13);--ink:#111114;--ink-2:#3a3a40;--muted:#6b6b73;--faint:#a1a1a8;
  --accent:#ffc700;--accent-soft:#fff3c4;--accent-ink:#5c4700;--ok:#1a8f4e;--ok-soft:#e5f5ec;--warn:#a35f00;--warn-soft:#fff1dc;--bad:#d1342b;--bad-soft:#fde9e7;
  --glass:rgba(255,255,255,.72);--glass-line:rgba(255,255,255,.85);
  --sh-1:0 1px 1px rgba(17,17,20,.04),0 2px 6px -2px rgba(17,17,20,.08);
  --sh-2:0 1px 1px rgba(17,17,20,.04),0 14px 34px -14px rgba(17,17,20,.22),inset 0 1px 0 rgba(255,255,255,.9);
  --sh-3:0 2px 4px rgba(17,17,20,.06),0 30px 70px -24px rgba(17,17,20,.38);
  --font:Inter,-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;--serif:'DM Serif Display',Georgia,serif;--r:22px;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);touch-action:pan-x pan-y;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 40vmax at 0% 0%,rgba(255,199,0,.22),rgba(255,199,0,0) 70%),radial-gradient(50vmax 40vmax at 100% 100%,rgba(17,17,20,.06),rgba(17,17,20,0) 70%)}
body{position:relative;color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.glass,.top,.card,.modal,.tabs{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:var(--sh-2)}
/* header: a floating glass pill */
.top{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:12px;margin:10px max(12px,env(safe-area-inset-left)) 0;padding:8px 10px 8px 8px;border-radius:999px;max-width:1336px}
@media (min-width:1360px){.top{margin-left:auto;margin-right:auto}}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13.5px;letter-spacing:-.02em;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px -4px rgba(255,170,0,.6)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.025em;white-space:nowrap;min-width:0}
.brand em,.gate h1 em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:0;background:var(--accent);padding:0 .22em .02em;border-radius:.28em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.grow{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:right;line-height:1.2;min-width:0}
.who>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who b{color:var(--ink)}
@media (max-width:560px){.who>div{display:none}}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:18px max(12px,env(safe-area-inset-left)) 40px;max-width:1360px;margin:0 auto}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.wrap.is-home aside{display:none}}.wrap>*{min-width:0}
.card{border-radius:var(--r);padding:18px 20px}
@media (max-width:560px){.card{padding:16px}}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.02em}.card h3{margin:20px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.hint{color:var(--muted);font-size:12.5px}.err{color:var(--bad);font-size:12.5px}.okt{color:var(--ok);font-size:12.5px}
/* buttons: pills; primary is the brand's black pill */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--hair-2);background:rgba(255,255,255,.85);border-radius:999px;padding:8px 15px;font-weight:650;font-size:13px;cursor:pointer;min-height:38px;
  box-shadow:var(--sh-1);transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(17,17,20,.3)}.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 20px -10px rgba(17,17,20,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 12px;min-height:32px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.list{display:flex;flex-direction:column;gap:8px}
.cl{display:flex;flex-direction:column;gap:7px;text-align:left;border:1px solid var(--hair);background:rgba(255,255,255,.7);border-radius:16px;padding:13px 14px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .15s ease,box-shadow .15s ease}
.cl:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(17,17,20,.28)}
.cl[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 14px 28px -14px rgba(17,17,20,.6)}.cl b{font-size:14px;font-weight:750;letter-spacing:-.01em}
.cl[aria-current=true] .chip{background:rgba(255,255,255,.14);color:#fff}.cl[aria-current=true] .chip.ok{background:rgba(52,199,89,.28)}.cl[aria-current=true] .chip.acc{background:var(--accent);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
/* tabs: a glass segmented pill, the active one a black pill */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:999px;margin:14px 0 18px;box-shadow:var(--sh-1)}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:650;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:0 6px 14px -6px rgba(17,17,20,.55)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kpi{background:rgba(255,255,255,.75);border:1px solid var(--hair);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1)}
.kpi>span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}.kpi b{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* tiers: floating cards; the chosen one goes black with a yellow price */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tier{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;border:1px solid var(--hair);border-radius:20px;padding:16px;cursor:pointer;background:rgba(255,255,255,.8);text-align:left;box-shadow:var(--sh-1);transition:transform .18s ease,box-shadow .18s ease;color:var(--ink)}
.tier:hover{transform:translateY(-2px);box-shadow:0 16px 30px -16px rgba(17,17,20,.3)}
.tier[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 22px 40px -18px rgba(17,17,20,.65)}
.tier b{font-size:15px;font-weight:800;letter-spacing:-.015em}.tier .pr{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.tier[aria-pressed=true] .pr{color:var(--accent)}.tier[aria-pressed=true] .hint{color:rgba(255,255,255,.66)}
.tier ul{margin:8px 0 0;padding-left:17px;color:var(--ink-2);font-size:12.5px}.tier[aria-pressed=true] ul{color:rgba(255,255,255,.86)}
.tier li::marker{color:var(--accent)}
.rows{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.rows .row>span:last-child{min-width:0;max-width:62%;text-align:right;overflow-wrap:anywhere}.row .t b{display:block;font-size:13.5px;font-weight:700}.row .t small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);border:1px solid var(--hair);border-radius:999px;padding:3px;box-shadow:var(--sh-1)}
.qty .btn{min-width:34px;min-height:34px;padding:0 10px;box-shadow:none;border:0;background:var(--surface-2);font-size:16px}.qty .btn:hover{background:var(--accent)}
.qty b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800}.qty .btn:disabled{opacity:.35;background:var(--surface-2)}
/* switches: iOS style, black when on */
.sw{position:relative;width:50px;height:30px;border-radius:999px;background:rgba(17,17,20,.14);border:0;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.04);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked=true]{background:var(--ink)}.sw[aria-checked=true]::after{transform:translateX(20px)}
label.f,.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:650}
input,select,textarea{border:1px solid var(--hair-2);border-radius:13px;padding:9px 12px;background:rgba(255,255,255,.9);min-height:40px;font-size:14px;font-weight:500;min-width:0;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,199,0,.35)}
@media (max-width:720px){input,select,textarea{font-size:16px}}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.diff{width:100%;border-collapse:collapse;font-size:12.5px}.diff td,.diff th{padding:7px 8px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}.diff th{color:var(--muted);font-weight:650}
.diff s{color:var(--bad)}.diff ins{color:var(--ok);text-decoration:none;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(17,17,20,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease}
.modal{border-radius:26px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;background:rgba(255,255,255,.9);box-shadow:var(--sh-3);animation:popIn .22s cubic-bezier(.2,1.2,.4,1)}
.modal h2{font-weight:800;letter-spacing:-.02em}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@keyframes fadeIn{from{opacity:0}}@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:30;font-weight:650;font-size:13px;max-width:92vw;box-shadow:var(--sh-3)}
.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--hair)}.step:first-child{border-top:0}
.step .n{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:800;flex:none}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.links a{display:block;padding:12px 14px;border:1px solid var(--hair);border-radius:16px;color:var(--ink);text-decoration:none;font-weight:700;background:rgba(255,255,255,.75);box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s}
.links a:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(17,17,20,.28)}.links a small{display:block;color:var(--muted);font-weight:400;overflow-wrap:anywhere}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* sign-in: the brand mark on a glass card */
.gate{max-width:460px;margin:11vh auto 40px;padding:34px 26px 26px;text-align:center;border-radius:30px}
.gate .mark{width:64px;height:64px;border-radius:18px;font-size:24px;margin:0 auto 18px}
.gate h1{font-weight:800;font-size:34px;letter-spacing:-.035em;margin:0 0 8px;line-height:1.15}.gate p{color:var(--muted)}
@media (max-width:480px){.gate{margin:6vh 12px 30px}.gate h1{font-size:29px}}
#gbtn{display:flex;justify-content:center;margin:20px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- v2: account pill, search pill, client marks, status dots ---- */
.me{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid var(--hair);font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.me img{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(17,17,20,.18)}
@media (max-width:560px){.me span{display:none}.me{padding:3px}}
.kbtn{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:0 8px 0 14px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.65);color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;min-width:180px}
.kbtn:hover{color:var(--ink)}.kbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.kbd{margin-left:auto;font:600 11px/1 var(--font);border:1px solid var(--hair-2);border-bottom-width:2px;border-radius:7px;padding:4px 6px;color:var(--muted);background:#fff}
@media (max-width:720px){.kbtn{min-width:0;padding:0 11px}.kbtn .lbl,.kbtn .kbd{display:none}}
@media (max-width:440px){.top .bw{display:none}.top{gap:8px}.top .btn.sm{min-width:38px;min-height:38px;padding:0 12px;font-size:16px}}
.av{--c:#111114;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 14px -6px var(--c)}
.av.img{background:#fff;border:1px solid var(--hair);box-shadow:0 6px 14px -8px var(--c)}.av img{width:24px;height:24px;object-fit:contain}
.cl-h{display:flex;align-items:center;gap:10px;min-width:0}.cl-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;box-shadow:0 0 0 3px rgba(161,161,168,.2)}
.dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);animation:pulse 2.6s ease-in-out infinite}
.dot.warn{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.22)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(209,52,43,.2)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.cl.homeb{flex-direction:row;align-items:center;gap:10px}.cl.homeb .av{background:var(--accent);color:var(--ink);box-shadow:0 6px 14px -6px rgba(255,170,0,.8)}
.cl.homeb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2}
.health{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}.health span{display:inline-flex;align-items:center;gap:6px}
/* ---- v2: sliding tab indicator ---- */
.tabs{position:relative}.tabs button{position:relative;z-index:1}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--ink);box-shadow:0 6px 14px -6px rgba(17,17,20,.55);z-index:0;transition:left .38s cubic-bezier(.3,1.25,.45,1),width .38s cubic-bezier(.3,1.25,.45,1)}
.tabs.js button[aria-pressed=true]{background:transparent;box-shadow:none}
/* ---- v2: home ---- */
.hero{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.hero h2{font-size:24px!important;letter-spacing:-.03em!important}
.hlist{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.8fr) 132px;align-items:center;gap:14px;padding:13px 16px;border-radius:18px;background:rgba(255,255,255,.78);border:1px solid var(--hair);box-shadow:var(--sh-1);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.hrow .who2{display:flex;align-items:center;gap:11px;min-width:0}.hrow .who2>div{min-width:0}.hrow .who2 b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .m>span{display:block;font-size:11px;color:var(--muted);font-weight:650}.hrow .m b{white-space:nowrap;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.spark{width:132px;height:38px;display:block}
@media (max-width:900px){.hrow{grid-template-columns:minmax(0,1fr) auto;row-gap:10px}.hrow .m{display:none}.hrow .m.keep{display:block;text-align:right}.spark{width:110px}}
/* ---- v2: plan ---- */
.tier{position:relative;overflow:visible}
.ribbon{position:absolute;top:-11px;right:14px;background:var(--accent);color:var(--ink);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:5px 11px;border-radius:999px;box-shadow:0 8px 18px -8px rgba(255,160,0,.9);z-index:2}
details.cmpd{margin-top:16px}details.cmpd summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:750;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--hair-2);background:rgba(255,255,255,.85);box-shadow:var(--sh-1)}
details.cmpd summary::-webkit-details-marker{display:none}details.cmpd summary::after{content:'';width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.cmpd[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.tblw{overflow-x:auto;margin-top:10px;border:1px solid var(--hair);border-radius:18px;background:rgba(255,255,255,.75);box-shadow:var(--sh-1)}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px;min-width:440px}.cmp th,.cmp td{padding:9px 12px;border-bottom:1px solid var(--hair);text-align:center;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}.cmp tr:last-child td{border-bottom:0}
.cmp thead th{font-weight:800;font-size:13px;letter-spacing:-.01em;padding-top:12px}.cmp thead small{display:block;font-weight:650;color:var(--muted);font-size:11.5px}
.cmp .hl{background:rgba(255,199,0,.12)}.cmp .y{font-weight:800}.cmp .n{color:var(--faint)}.cmp .a{color:var(--accent-ink);font-weight:650;font-size:11.5px}
.total{position:sticky;bottom:12px;z-index:3;display:flex;align-items:center;gap:12px;margin-top:18px;padding:8px 8px 8px 20px;border-radius:999px;flex-wrap:wrap}
.total .n{font-size:21px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}.total small{color:var(--muted);font-weight:600}
/* ---- v2: billing timeline ---- */
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:6px 0 4px}
.tl .st{position:relative;padding-top:26px;text-align:center;font-size:12px;min-width:0}
.tl .st::before{content:'';position:absolute;top:10px;left:0;right:0;height:3px;background:var(--hair-2)}
.tl .st:first-child::before{left:50%}.tl .st:last-child::before{right:50%}.tl .st.done::before{background:var(--ink)}
.tl .st i{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid var(--hair-2);box-sizing:border-box}

    h('div',{class:'foot'},h('span',null,'↑↓ to move'),h('span',null,'↵ to open'),h('span',null,'esc to close'))));
  document.body.append(sc);find();setTimeout(()=>inp.focus())}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.me){e.preventDefault();cmdk()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('.cmdk')){const m=[...document.querySelectorAll('.scrim')].pop();if(m)m.remove()}});

function addClient(){const f={id:h('input',{placeholder:'e.g. hillnest'}),name:h('input',{placeholder:'Business name'}),api_url:h('input',{placeholder:'https://script.google.com/macros/s/…/exec'}),dashboard_url:h('input',{placeholder:'https://…'}),manager_url:h('input',{placeholder:'https://…/manager/'}),repo:h('input',{placeholder:'owner/wa-client'})},err=h('div',{class:'err'});
  modal('Add a client',h('div',null,h('div',{class:'form'},Object.entries(f).map(([k,i])=>h('label',{class:'f'},k.replace('_',' '),i))),err,
    h('p',{class:'hint'},'Saved on this device. To keep it for every device, use “Copy registry” and commit it as clients.json. Next: set the script property CONSOLE_KEY on the client’s Apps Script, then Connect.')),
    close=>[h('button',{class:'btn',onclick:()=>{navigator.clipboard.writeText(JSON.stringify({google_client_id:S.reg.google_client_id,clients:S.reg.clients.filter(c=>!c.test)},null,2)).then(()=>toast('Registry copied ✓'))}},'Copy registry'),
      h('button',{class:'btn',onclick:close},'Cancel'),h('button',{class:'btn primary',onclick:()=>{const v=Object.fromEntries(Object.entries(f).map(([k,i])=>[k,i.value.trim()]));
        if(!/^[a-z0-9-]{2,30}$/.test(v.id))return err.textContent='Id: 2-30 lowercase letters, digits or dashes.';if(!/^https:\/\//.test(v.api_url))return err.textContent='The sheet API must be an https link.';if(client(v.id))return err.textContent='That id exists.';
        ls.set('swl_clients_extra',[...ls.get('swl_clients_extra',[]),v]);close();loadReg().then(()=>{S.sel=v.id;draw()})}},'Add')])}
function removeClient(c){modal('Remove '+c.name+' from the console?',h('p',null,'Only this console forgets it (and its key on this device). The client’s data and plan are not touched. To offboard them, use Offboarding first.'),
  close=>[h('button',{class:'btn',onclick:close},'Keep'),h('button',{class:'btn danger',onclick:()=>{ls.set('swl_clients_removed',[...ls.get('swl_clients_removed',[]),c.id]);ls.set('swl_clients_extra',ls.get('swl_clients_extra',[]).filter(x=>x.id!==c.id));ls.del('swl_key_'+c.id);ls.del('swl_sess_'+c.id);close();loadReg().then(draw)}},'Remove')])}

loadReg().then(()=>{draw();S.reg.clients.forEach(c=>{ping(c);versions(c)});setInterval(()=>S.reg.clients.forEach(ping),5*60e3);const c=client(S.sel);if(c&&S.me&&sess(c))refresh(c)});
</script>
