<script>
const CLIENT={"brand":"Pinewood Stays","api_url":"https://script.google.com/macros/s/DEMO1/exec","app":{"app_name":"Pinewood Stays","short_name":"Pinewood","description":"Bookings, money, check-in desk and WhatsApp leads in one place.","background":"#f6f8fc","theme":"#f6f8fc","icon_color":"#1d5bd8"}};
/* Shared by the dashboard and the manager app (build.py puts it in both): what is due, done or missed for checkout
   checklists, stock checks and guest reviews; manager scorecards; and "what's new since you last looked" from outside
   sources (the WhatsApp bot, manager apps). Pure functions over the register rows - no screen code here. */
const OPS=(()=>{
  const iso=d=>d.toISOString().slice(0,10);
  const addD=(s,n)=>{const d=new Date(String(s).slice(0,10)+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
  const dayDiff=(a,b)=>Math.round((new Date(String(b).slice(0,10)+'T12:00:00Z')-new Date(String(a).slice(0,10)+'T12:00:00Z'))/864e5);
  const list=v=>Array.isArray(v)?v:typeof v==='string'&&v.trim().startsWith('[')?(()=>{try{return JSON.parse(v)}catch(e){return[]}})():String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
  const js=v=>{if(v&&typeof v==='object')return v;try{return v?JSON.parse(v):null}catch(e){return null}};
  const DEF_CHECK=['Linen changed and beds made','Bathrooms cleaned','Kitchen and dishes clean','Floors swept and mopped','Bins emptied',
    'Fresh towels out','Toiletries refilled','AC, fans and lights off','Doors and windows locked','Damage or missing items checked'];
  const DEF_STOCK=[{name:'Bedsheets'},{name:'Pillow covers'},{name:'Towels'},{name:'Toiletry kits'},{name:'Toilet rolls'},
    {name:'TV working',type:'ok'},{name:'Wi-Fi working',type:'ok'},{name:'Geyser working',type:'ok'},{name:'First-aid kit',type:'ok'}];
  /* suggestions shown unticked in Manager app setup (the admin ticks what applies, or adds their own) */
  const PRESET_CHECK=[...DEF_CHECK,'Fridge emptied and wiped','Geyser and heaters off','Gas knob closed','Keys and remotes in place','Bin liners replaced',
    'Mirrors and glass wiped','Balcony swept','Water bottles refilled','Mattress and pillows checked for stains'];
  const PRESET_STOCK=[...DEF_STOCK,{name:'Hand wash'},{name:'Dishwash liquid'},{name:'Garbage bags'},{name:'Drinking water bottles'},{name:'Tea and coffee kits'},
    {name:'Spare gas cylinder full',type:'ok'},{name:'Inverter working',type:'ok'},{name:'AC remote working',type:'ok'},{name:'Iron working',type:'ok'},{name:'Hair dryer working',type:'ok'}];
  const DEF_REQ=['Extra towels','Extra blankets','Room cleaning','Drinking water','Toiletries refill','Gas cylinder','Extra mattress'];
  const PRESET_REQ=[...DEF_REQ,'Extra pillows','Iron','Hair dryer','Room heater','Kettle','Hot water bottle','Firewood'];
  /* an item: {name, type, expect|min, photo, off}. Checklist type tick|count (expect = the number there should be);
     stock type count|ok (min = buy more below it). Old lists of plain text still work. */
  const normCheck=x=>typeof x==='string'?{name:x.trim(),type:'tick'}:{...x,name:String((x&&x.name)||'').trim(),type:x&&x.type==='count'?'count':'tick'};
  const normStock=x=>typeof x==='string'?parseItem(x):{...x,name:String((x&&x.name)||'').trim()};
  const normReq=x=>typeof x==='string'?{name:x.trim()}:{...x,name:String((x&&x.name)||'').trim()};
  const active=(arr,norm)=>{const out=[];arr.map(norm).forEach(it=>{if(it.name&&!it.off&&!out.some(o=>o.name===it.name))out.push(it)});return out};
  /* is a checklist item done: ticked, or counted (and at least the expected number when one is set) */
  const checkDone=(it,v)=>it.type==='count'?v!=null&&v!==''&&!isNaN(+v)&&(!it.expect||+v>=it.expect):v===true;
  /* settings: Settings rows ops.* / reviews.* over the client's defaults */

/* ============ outbox: anything saved without a connection waits on the phone (with its photos) and is sent when the

const OB=(()=>{let dbP=null;const db=()=>dbP=dbP||new Promise((ok,no)=>{if(!window.indexedDB)return no(new Error('no idb'));const r=indexedDB.open('mg_outbox',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  const tx=(mode,fn)=>db().then(d=>new Promise((ok,no)=>{const t=d.transaction('q',mode),st=t.objectStore('q'),res=fn(st);t.oncomplete=()=>ok(res&&res.result);t.onerror=()=>no(t.error)}));
  const ls=()=>store.get('mg_outbox')||[];
  return{add:it=>tx('readwrite',st=>st.put(it)).catch(()=>{const a=ls();a.push(it);store.set('mg_outbox',a)}),
    all:()=>tx('readonly',st=>st.getAll()).then(a=>(a||[]).concat(ls())).catch(()=>ls()),
    del:id=>tx('readwrite',st=>st.delete(id)).catch(()=>{}).then(()=>store.set('mg_outbox',ls().filter(x=>x.id!==id)))}})();

/* Geotag: where the phone is when a checklist, stock check or issue is sent. The sheet works out the distance to the

const geoOn=()=>{const r=((S.d||{}).ops||[]).filter(x=>x.key==='ops.geotag').pop(),pf=(((S.d||{}).plan||{}).features||{}).geotag;return!(r&&/^(off|no|false|0)$/i.test(String(r.value||'').trim()))&&!/^(off|no|false|0)$/i.test(String(pf||''))};
function geoNow(){return new Promise(ok=>{if(!navigator.geolocation)return ok({flag:'no_fix'});
  navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy||0)}),
    e=>ok(e&&e.code===1?{denied:true}:{flag:'no_fix'}),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}

  return g.flag?{geo_flag:g.flag,geo_at:nowIso()}:{geo_lat:g.lat,geo_lng:g.lng,geo_acc_m:g.acc,geo_at:nowIso()}}
